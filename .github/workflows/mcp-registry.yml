# Publish the server entry to the MCP registry, after the npm package is out.
#
# The registry holds metadata only: `server.json` names the npm package and the
# version, and the registry checks that the published package.json carries the
# matching `mcpName`. So this runs when the `publish` workflow has succeeded,
# on the commit it published, and only once npm actually serves that version.
# A dispatch with the tag replays it when a run was missed.
#
# Authenticated by GitHub OIDC: the registry grants the io.github.<owner>/*
# namespace to a job of a repository that owner holds. No secret to rotate.
name: mcp-registry

on:
  workflow_run:
    workflows: [publish]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag already published to npm, with the v prefix (e.g. v0.1.5).
        required: true

permissions:
  contents: read
  id-token: write # the claim that authenticates this run to the registry

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The dispatched tag, or the commit the publish run checked out.
          ref: ${{ inputs.tag || github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22

      # The registry refuses an entry whose package is not on npm yet, and
      # publishing a version npm does not serve would leave a dangling entry.
      - name: server.json, package.json and npm agree
        run: |
          declared=$(node -p "require('./package.json').version")
          entry=$(node -p "require('./server.json').version")
          name=$(node -p "require('./package.json').name")
          if [ "$declared" != "$entry" ]; then
            echo "::error::package.json $declared, server.json $entry - one of them is wrong."
            exit 1
          fi
          for attempt in 1 2 3 4 5 6; do
            served=$(npm view "$name@$declared" version 2>/dev/null || true)
            [ "$served" = "$declared" ] && break
            echo "npm does not serve $name@$declared yet (attempt $attempt)"; sleep 30
          done
          if [ "$served" != "$declared" ]; then
            echo "::error::npm does not serve $name@$declared; publish first."
            exit 1
          fi

      - name: Install mcp-publisher
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher
          ./mcp-publisher --help >/dev/null

      - name: Validate server.json
        run: ./mcp-publisher validate

      - name: Authenticate to the MCP registry
        run: ./mcp-publisher login github-oidc

      - name: Publish the server entry
        run: ./mcp-publisher publish

      - name: The registry lists it
        run: |
          name=$(node -p "require('./server.json').name")
          version=$(node -p "require('./server.json').version")
          curl -fsS "https://registry.modelcontextprotocol.io/v0/servers?search=$name" | grep -q "\"version\":\"$version\"" \
            || { echo "::error::$name $version is not listed."; exit 1; }
