name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Le bloc `permissions` se pose PAR JOB et non au niveau du fichier : sans lui
# le jeton du runner porte le defaut du depot, qui peut etre en ecriture
# (CodeQL actions/missing-workflow-permissions), et pose une seule fois en tete
# il rend un job muet sur ce qu'il demande vraiment (Sonar githubactions:S8264).
# Les deux regles ne veulent pas la meme chose, et seul le niveau job satisfait
# les deux. Rien ici n'ecrit : la gate lit l'arbre, le job de derive clone un
# depot public.
jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      # `--ignore-scripts` blocks the install-time lifecycle hooks of every
      # dependency, direct or transitive: they run arbitrary code with the
      # runner's token before a single test does, and that is the shortest path
      # a compromised package has into a build. Sonar githubactions:S6505,
      # 2026-08-06. Nothing here needs a postinstall.
      - run: npm ci --ignore-scripts
      - run: npm run gate

  schema-drift:
    # The schemas are copied in so validation works offline, and a copy drifts.
    # This fails the day the specification moves and this package does not,
    # which is the one way a reference implementation quietly becomes wrong.
    name: schemas match the specification
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Fetch the specification
        run: git clone --depth 1 https://github.com/assetnotation/spec.git /tmp/spec
      - name: Compare schemas and examples
        run: |
          diff -r schema /tmp/spec/schema
          diff -r examples /tmp/spec/examples
