name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Without this line the runner token carries whatever the repository default
# grants, which on a public repo can be write. Nothing here writes: the gate
# reads the tree and the drift job clones a public repository. CodeQL
# actions/missing-workflow-permissions, 2026-08-20.
permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      # `--ignore-scripts` blocks the install-time lifecycle hooks of every
      # dependency, direct or transitive: they run arbitrary code with the
      # runner's token before a single test does, and that is the shortest path
      # a compromised package has into a build. Sonar githubactions:S6505,
      # 2026-08-06. Nothing here needs a postinstall.
      - run: npm ci --ignore-scripts
      - run: npm run gate

  schema-drift:
    # The schemas are copied in so validation works offline, and a copy drifts.
    # This fails the day the specification moves and this package does not,
    # which is the one way a reference implementation quietly becomes wrong.
    name: schemas match the specification
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Fetch the specification
        run: git clone --depth 1 https://github.com/assetnotation/spec.git /tmp/spec
      - name: Compare schemas and examples
        run: |
          diff -r schema /tmp/spec/schema
          diff -r examples /tmp/spec/examples
