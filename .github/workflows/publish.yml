# Publish to npm.
#
# Manual, deliberately. A tag must not be able to publish on its own: a release
# goes out when somebody decides it does, and a tag is often pushed to see what
# CI says.
#
# It publishes a TAG, never a branch. Dispatched without one it would check out
# the default branch and publish whatever `main` happened to be at that minute,
# which is not the commit the release notes describe and not the commit the
# provenance would then attest to. The tag is required.
#
# Authenticated by OIDC (npm trusted publishing), not by a secret: npmjs.com
# names this repository and this workflow FILE as allowed to publish this
# package. Renaming this file, or moving the job into another workflow, revokes
# that permission until the trusted publisher is updated to match. A fork cannot
# publish, because the claim carries the repository it came from.
name: publish

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to publish, with the v prefix (e.g. v0.1.1).
        required: true

permissions:
  contents: read
  id-token: write # the claim that authenticates this run to the registry

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Pinned to a commit here, unlike ci.yml, and the difference is the point:
      # this is the job that builds the tarball the world installs and signs a
      # statement about where it came from. A movable tag means the thing that
      # attests could be swapped under a name that never changed.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false

      # No `registry-url`. It looks like the setting that points npm at the
      # registry, and what it actually does is WRITE AN .npmrc carrying an auth
      # line - which is precisely what stops npm from reaching for OIDC. npm
      # asks the registry to authenticate this workflow only when it finds no
      # credential configured for that registry.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm

      # Trusted publishing needs npm 11.5.1+, and the Node here ships an older
      # one on some runner images. Pinned exactly, and installed without its
      # lifecycle scripts: this is the tool that signs the artefact and speaks
      # for this repository to the registry.
      - run: npm install -g --ignore-scripts npm@11.19.0

      # npm 10 has no notion of trusted publishing at all - it would ask for a
      # token and report only that it needs auth, which is indistinguishable
      # from a missing secret. One line, so the next reader is never left
      # guessing which npm spoke.
      - name: which npm publishes, and can it ask for a token
        run: |
          echo "npm $(npm --version) at $(command -v npm)"
          if [ -z "$ACTIONS_ID_TOKEN_REQUEST_URL" ]; then
            echo "::error::no OIDC request URL in this job - id-token: write is missing or the runner did not mint one."
            exit 1
          fi
          echo "OIDC request URL present."

      - run: npm ci --ignore-scripts

      # The one mistake this cannot recover from. A version is never
      # unpublished, so a tag dispatched by hand that does not match the version
      # in the tree burns a number - either the wrong code goes out under the
      # right name, or the bump was forgotten and npm rejects it after the gate
      # has already run. Two seconds, before anything else.
      - name: the tag and package.json agree
        # Through `env`, not inline: an expression inside a `run:` block is
        # substituted into the script before bash reads it, so a dispatched
        # value would be executed rather than compared.
        env:
          TAG: ${{ inputs.tag }}
        run: |
          tagged="${TAG#v}"
          declared=$(node -p "require('./package.json').version")
          if [ "$tagged" != "$declared" ]; then
            echo "::error::tag $tagged, package.json $declared - one of them is wrong."
            exit 1
          fi

      # No token. The registry decides whether this workflow, on this
      # repository, may publish this package - configured once on npmjs.com
      # under the package's Settings, and revocable there without touching
      # anything here.
      #
      # It replaces a token rather than joining one, because the token path is
      # closing: npm has stopped issuing classic automation tokens and now
      # refuses direct publishing from the granular tokens that bypass
      # two-factor auth. A token in this file would be a credential to rotate,
      # leak or let expire, and an expired one is the worst of those: it
      # publishes nothing while the job reports success.
      #
      # The whole gate stands between this and the registry: `prepublishOnly`
      # runs format, lint, typecheck, tests and build. A version is never
      # unpublished, so it is checked before, not after.
      - name: publish
        env:
          # A publish that fails says WHY. Without this, npm decides in silence
          # whether to ask the registry to authenticate this workflow, and a
          # refusal arrives as a bare "need auth" that reads like a missing
          # token. The extra output only ever appears on the one job that
          # publishes, a few times a month.
          NPM_CONFIG_LOGLEVEL: verbose
        run: npm publish --provenance --access public
