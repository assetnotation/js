# Weekly dependency PRs, grouped to keep the noise down: one PR for all
# minor/patch bumps, majors stay individual (they need real review).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # typescript 7 is held back on purpose, not forgotten. typescript-eslint
    # 8.66.0 - the latest - still declares 	ypescript >=4.8.4 <6.1.0, so a TS 7
    # bump cannot install: npm fails with ERESOLVE before a single check runs.
    # Remove this block the day typescript-eslint accepts 7, and let the bump
    # come through. TS 8 is deliberately NOT ignored.
    ignore:
      - dependency-name: typescript
        versions:
          - 7.x
    groups:
      npm-minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # typescript 7 is held back on purpose, not forgotten. typescript-eslint
    # 8.66.0 - the latest - still declares 	ypescript >=4.8.4 <6.1.0, so a TS 7
    # bump cannot install: npm fails with ERESOLVE before a single check runs.
    # Remove this block the day typescript-eslint accepts 7, and let the bump
    # come through. TS 8 is deliberately NOT ignored.
    ignore:
      - dependency-name: typescript
        versions:
          - 7.x
    groups:
      actions:
        patterns:
          - '*'
